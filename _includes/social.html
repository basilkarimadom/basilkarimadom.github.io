<section id="{{ include.section.section_id | default: 'social' }}" class="page-section bg-light">
  <div class="container">
    <h2 class="text-center mt-0">{{ include.section.title }}</h2>
    <hr class="divider" />

    <div class="row g-4 justify-content-center">

      {% for post in include.section.posts %}
      <div class="col-lg-4 col-md-6">
        <div class="p-4 h-100 shadow-sm rounded bg-white">
          <div class="d-flex align-items-center mb-2">
            <i class="bi bi-twitter-x me-2"></i>
            <strong>{{ post.author }}</strong>
          </div>

          <p class="mb-3 text-muted">
            {{ post.text }}
          </p>

          <a href="{{ post.url }}"
             target="_blank"
             rel="noopener"
             class="btn btn-sm btn-outline-dark">
            View on X →
          </a>
        </div>
      </div>
      {% endfor %}

    </div>

    <div class="text-center mt-4">
      <a href="https://x.com/{{ include.section.handle }}"
         target="_blank"
         class="btn btn-dark">
        Follow on X
      </a>
    </div>
  </div>
</section>
