<section id="{{ section.section_id }}" class="page-section gallery-section">
  <div class="container">
    <div class="text-center">
      <h2 class="mt-0">{{ section.title }}</h2>
      {% if section.subtitle %}
        <p class="text-white-75 mb-4">{{ section.subtitle }}</p>
      {% endif %}
      <hr class="divider" />
    </div>

    {% assign items = site.data[section.data] %}

    <div class="gallery-grid" data-gallery="{{ section.section_id }}">
      {% for item in items %}
        <figure class="gallery-card">
          <a href="{{ item.image }}" class="gallery-link" title="{{ item.caption | escape }}">
            <div class="gallery-frame">
              <img src="{{ item.image }}" alt="{{ item.caption | escape }}">
            </div>
          </a>
          {% if item.caption %}
            <figcaption class="gallery-caption">{{ item.caption }}</figcaption>
          {% endif %}
        </figure>
      {% endfor %}
    </div>
  </div>
</section>

<script>
  window.addEventListener("load", function () {
    if (window.SimpleLightbox) {
      // one gallery per section (conferences and posters separate)
      document.querySelectorAll('.gallery-grid[data-gallery]').forEach(function(grid){
        new SimpleLightbox(grid.querySelectorAll('a.gallery-link'), {
          captions: true,
          captionSelector: 'self',
          captionType: 'attr',
          captionAttribute: 'title',
          close: true,
          showCounter: true
        });
      });
    }
  });
</script>
