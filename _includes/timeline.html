<section class="page-section {{ section.background_style }}" id="{{ section.section_id }}">
  <div class="container px-4 px-lg-5">

    <div class="timeline-ribbon-wrap">
      <div class="timeline-ribbon"></div>

      <div class="timeline-ribbon-items">
        {% for action in section.actions %}
          {% assign is_top = forloop.index0 | modulo: 2 %}
          <div class="timeline-item {% if is_top == 0 %}is-top{% else %}is-bottom{% endif %}">
            
            <div class="timeline-content">
              <div class="timeline-year">{{ action.year }}</div>
              <div class="timeline-text text-white-75">
                <div class="timeline-title">{{ action.title }}</div>
                <div class="timeline-inst">{{ action.institute }}</div>
              </div>
            </div>

            <div class="timeline-dotline"></div>

            <div class="timeline-circle">
              <img src="{{ action.logo }}" alt="{{ action.institute }} logo">
            </div>

          </div>
        {% endfor %}
      </div>
    </div>

  </div>
</section>
