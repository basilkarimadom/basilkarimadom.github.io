title: "Profile"

intro:
  background_style: "bg-gradient-1"
  image: "/assets/img/profile/profile.jpg"
  name: "Basil Raju"
  tagline: "Postdoctoral Researcher • Computational Chemistry"
  summary: >
    Basil Raju is a researcher working in the area of computational chemistry and materials science.
    His work broadly focuses on understanding chemical processes at interfaces and exploring how
    surface interactions influence reactivity and selectivity. He is interested in translating
    fundamental insights into practical directions for catalysis and energy-related applications.
    This page provides a quick overview of his academic path and online academic profiles.

